# What a correct answer contains, copied from evals/questions.md. Used by evals/deepeval_eval.py as expected_output.
Q01: "No. Food is not allowed on the fuel card. Meals are covered by a per diem paid through payroll."
Q02: "If in a dangerous spot call 911 first. Then call the Breakdown desk at 905-555-0177 (24/7). Turn on hazards, wear the hi-vis vest, place warning triangles. Do not call a tow truck yourself."
Q03: "Stop and do not leave the scene. Call Dispatch at 905-555-0100. Take photos in the driver app. Exchange information with the other party. Do not admit fault. A report to a Collision Reporting Centre may be needed; Dispatch advises. Complete the incident report within 24 hours."
Q04: "Note the time. Tell Dispatch immediately. Start paper logs from the time of the malfunction. Dispatch books a repair and confirms the legal limit. Hand the paper logs to Safety & Compliance on return."
Q05: "After waiting more than 2 hours, send a 'Detention' update with the arrival time. Detention is paid at the rate in the pay schedule."
Q06: "Do not cross. Call the Border Desk at 905-555-0155."
Q07: "Not without written approval from Safety & Compliance."
Q08: "Never drive beyond legal limits. Report the request to Safety & Compliance. Reports are confidential. No discipline for stopping legally."
Q09: "States the Canadian daily driving limit (13 hours of driving) and the on-duty limit (no driving after 14 hours on duty) from the Hours of Service Regulations SOR/2005-313, and cites it."
Q10: "Explains that US limits differ from Canadian ones, gives the FMCSA limits, and says to follow US rules on the US leg. If the FMCSA limits are not in the documents it must say so rather than state a number."
Q11: "Summarises the daily (pre-trip) inspection requirements and says that a major defect means the vehicle must not be driven."
Q12: "Explains that a CVOR is the commercial vehicle operator's registration, and that the driver carries a copy of the certificate in the vehicle."
Q13: "Passport or FAST card, the ACE lead sheet, bill of lading and commercial invoice for every shipment, seal number matching the lead sheet, and 'ACE accepted' confirmed by the Border Desk. Drivers do not file eManifests themselves."
Q14: "Summarises the Ontario demerit point system: points are recorded for driving-related convictions, stay on the record for two years, and too many points can lead to licence suspension."
Q15: "Covers both parts: northbound paperwork (passport or FAST card, ACI lead sheet, bill of lading and commercial invoice, 'ACI accepted') and the Canadian hours-of-service limits (13 hours driving, 14 hours on duty in a day)."
