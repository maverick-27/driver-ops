[project]
name = "driver-ops"
version = "0.1.0"
description = "Driver Ops: RAG agent for trucking compliance and company procedures, answered over Telegram"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings==2.10.1",
    "sqlalchemy==2.0.43",
    "psycopg2-binary>=2.9",
    "opensearch-py==3.0.0",
    "httpx>=0.27",
    "redis>=5,<7",
    "langfuse==3.9.0",
    "langgraph==1.0.2",
    "langchain-core>=1.0,<2",
    "langchain-ollama>=1.0,<1.1",
    "python-telegram-bot>=21,<22",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "asgi-lifespan>=2.1",
    "pyyaml>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-playwright>=0.9.0",
]
eval = [
    "deepeval>=4.2.7",
]
# Only the Airflow image parses PDFs; kept out of the API image.
ingest = ["docling==2.52.0"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: browser tests of the chat UI (mocked API stream)",
    "live: browser tests against the real running stack (API, Ollama, index)",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.isort]
known-third-party = ["airflow"]
